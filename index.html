<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vigil – Always-On Clock</title>
<meta name="description" content="A calm always-on clock for a spare monitor or your laptop: ten faces, your colours, keeps the screen awake, gentle on OLED.">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<canvas id="clock" aria-label="Clock"></canvas>
<div class="hud" id="hud">
  <button class="hud-btn" id="btnFull" type="button" title="Full screen (F)" aria-label="Full screen"></button>
  <button class="hud-btn" id="btnSettings" type="button" title="Settings (S)" aria-label="Settings"></button>
</div>
<div class="welcome" id="welcome" hidden>
  <b>Welcome to Vigil</b>
  <span>Press <kbd>F</kbd> for full screen · <kbd>←</kbd> <kbd>→</kbd> change face · move the mouse for settings</span>
  <button type="button" id="welcomeOk">Got it</button>
</div>
<aside class="drawer" id="drawer" aria-label="Settings" hidden>
  <div class="drawer-head"><b>Settings</b><button class="x" id="drawerClose" type="button" aria-label="Close settings">×</button></div>
  <div class="drawer-body" id="drawerBody"></div>
</aside>
<script type="module" src="js/app.js"></script>
</body>
</html>
